services:
  - type: web
    name: expense-tracker-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: DB_PATH
        value: expenses.db
      - key: PYTHON_VERSION
        value: 3.12.4
